name: Validator (Android)

on:
  push:
    branches: [main]
    paths:
      - "ConcatNFCValidator/android/**"
      - ".github/workflows/validator-android.yml"
  pull_request:
    paths:
      - "ConcatNFCValidator/android/**"
      - ".github/workflows/validator-android.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ConcatNFCValidator/android

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble, unit test, lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: ConcatNFCValidator/android/app/build/reports/
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: validator-debug-apk
          path: ConcatNFCValidator/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
